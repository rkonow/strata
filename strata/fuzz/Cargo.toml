[package]
name = "strata-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
strata = { path = "..", default-features = false }
crc32fast = "1"
serde_json = "1"
tempfile = "3"

# Its own workspace, so that `cargo fuzz` builds it apart from Strata.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "loom"
path = "fuzz_targets/loom.rs"
test = false
doc = false
bench = false

[[bin]]
name = "segment"
path = "fuzz_targets/segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal"
path = "fuzz_targets/wal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sql"
path = "fuzz_targets/sql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media"
path = "fuzz_targets/media.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_query"
path = "fuzz_targets/text_query.rs"
test = false
doc = false
