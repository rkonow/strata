[package]
name = "strata"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "An embedded, single-file search database: full text, structured and vector indexes behind SQL"
publish = false

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = "1"
sqlparser = "0.59"
crc32fast = "1"
# SHA-256 of codebook files (semantic IDs, `sid`) and of MEDIA files.
sha2 = "0.10"
libc = "0.2"
# Log events (flush and merge failures, a database that stops writing);
# silent unless the program installs a subscriber, as strata-server does.
tracing = { version = "0.1", default-features = false, features = ["std"] }
lz4_flex = "0.11"
bitpacking = "0.9.3"
rand = "0.8"
rand_distr = "0.4"
# Reference implementation in the posting-list comparison (`postings::codecs::external`).
roaring = "0.11.5"
clap = { version = "4", features = ["derive"] }
rust-stemmers = "1.2"
# MEDIA values (`media`): bytes given as base64.
base64 = "0.22"
# SQLite (bundled, with FTS5): importing and exporting SQLite databases
# (feature `sqlite`, `strata::sqlite`) and the SQLite baseline (`baselines`).
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }
tantivy = { version = "0.26", optional = true }
# Embedding models for VECTOR fields declared with `embed` (`embed`):
# Model2Vec by default, BERT encoders through candle with `bert`.
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
# candle's matrix products, here only to turn on their AVX-512 kernels,
# which run where the CPU has AVX-512 (checked at run time).
gemm = { version = "0.19", features = ["x86-v4"], optional = true }
# Images decoded for SigLIP (`vision`).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"], optional = true }
# Audio decoded for Whisper (`audio`): WAV, FLAC, MP3, Ogg Vorbis, AAC in MP4.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "adpcm", "flac", "mp3", "ogg", "vorbis", "aac", "isomp4"], optional = true }

[features]
default = ["embed"]
embed = ["dep:tokenizers"]
bert = ["embed", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:gemm"]
# Images: decoded with the `image` crate, embedded by SigLIP.
vision = ["bert", "dep:image"]
# Audio: decoded with symphonia, transcribed by Whisper.
audio = ["bert", "dep:symphonia"]
# `bert` with matrix products in Apple's Accelerate framework (macOS only).
accelerate = ["bert", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# Importing SQLite databases into Strata and exporting Strata to SQLite
# (`strata::sqlite`).
sqlite = ["dep:rusqlite"]
# SQLite and Tantivy baselines and the `strata-baselines` experiment binary.
baselines = ["dep:rusqlite", "dep:tantivy"]
# Power losses, full disks and failing syncs for tests (`storage::io`).
fault-injection = []

[[bin]]
name = "strata-baselines"
path = "src/bin/strata-baselines.rs"
required-features = ["baselines"]

[[bin]]
name = "strata-media-eval"
path = "src/bin/strata-media-eval.rs"
required-features = ["vision"]

[[bin]]
name = "strata-asr-eval"
path = "src/bin/strata-asr-eval.rs"
required-features = ["audio"]

[[bin]]
name = "strata-clap-eval"
path = "src/bin/strata-clap-eval.rs"
required-features = ["audio"]

[dev-dependencies]
tempfile = "3"
# PNGs written by the tests of `vision`.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.test]
opt-level = 2

# CI's tests (cargo test --profile ci): release's optimisation without its
# link-time optimisation and single codegen unit, which made linking the
# hundred test binaries, each with all of Strata in it, most of CI's time.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
