[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "strata-db"
version = "0.1.0"
description = "Strata from Python: an embedded search database (full text, vectors, graphs, SQL), or a strata-server over HTTP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust"]

[project.optional-dependencies]
test = ["pytest"]
# strata.ingest.kafka
kafka = ["confluent-kafka>=2.3"]

[tool.maturin]
python-source = "python"
module-name = "strata._strata"
features = ["pyo3/extension-module"]
