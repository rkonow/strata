[package]
name = "engram"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Automatic long-term context for coding agents, stored in Strata"
publish = false

[dependencies]
strata = { path = "../strata" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"

[features]
# BGE-small through candle: better vectors, ~50 ms per record on CPU.
bert = ["strata/bert"]
# `bert` with matrix products in Apple's Accelerate framework (macOS only).
accelerate = ["strata/accelerate"]

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.test]
opt-level = 2

# CI's tests (cargo test --profile ci): release's optimisation without its
# link-time optimisation and single codegen unit, which take most of the
# time of building the test binaries.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
